name: Build and Push Pivot Stack

on:
  push:
    branches:
      - main
  # Ermöglicht das manuelle Starten der Action
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pivot-stack

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # GitHub Actions benötigt diese Permissions, um in die GHCR zu schreiben
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. SERVER IMAGE (latest) ---
      - name: Build Server Image
        id: build-server
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}
          containerfiles: |
            ./Containerfile.server

      - name: Push Server Image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-server.outputs.image }}
          tags: ${{ steps.build-server.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      # --- 2. TOOLBOX IMAGE (toolbox) ---
      - name: Build Toolbox Image
        id: build-toolbox
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: toolbox
          containerfiles: |
            ./Containerfile.toolbox

      - name: Push Toolbox Image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-toolbox.outputs.image }}
          tags: ${{ steps.build-toolbox.outputs.tags }}
          registry: ${{ env.REGISTRY }}
